[pytest]
testpaths = tests
addopts = -p no:cacheprovider
markers =
    android: isolated mobile workflow and regression tests
    device: ADB identity and UI boundaries
    navigation: native UI location and delivery matching
    acquisition: full JD collection and Jev reuse
    delivery: durable actions, deduplication and quota
    communication: reviewed text reply workflows
    native: native runner and Java send target selection
    recovery: migration, layout changes and previous batches
    protocol: response formats, routing and diagnostics
    proxy: capture ownership and proxy restoration
    policy: latest matching exclusions
    workflow: complete mobile use cases
